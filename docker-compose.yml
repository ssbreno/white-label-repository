version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: whitelabel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-whitelabel_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: whitelabel-backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-whitelabel_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    develop:
      watch:
        - action: rebuild
          path: ./apps/backend

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: whitelabel-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /app/src

volumes:
  postgres_data:

networks:
  default:
    name: whitelabel-network
